    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        #board {
            width: 306px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 3px;
        }

        .cell {
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <h2 id="turn">Player X's Turn</h2>

    <div id="board">

        <button class="cell" onclick="playGame(0)"></button>
        <button class="cell" onclick="playGame(1)"></button>
        <button class="cell" onclick="playGame(2)"></button>

        <button class="cell" onclick="playGame(3)"></button>
        <button class="cell" onclick="playGame(4)"></button>
        <button class="cell" onclick="playGame(5)"></button>

        <button class="cell" onclick="playGame(6)"></button>
        <button class="cell" onclick="playGame(7)"></button>
        <button class="cell" onclick="playGame(8)"></button>

    </div>

    <button onclick="resetGame()">Reset Game</button>


    <script>

        let currentPlayer = "X";

        let board = ["", "", "", "", "", "", "", ""];

        function playGame(position) {

            // Don't allow already filled box
            if (board[position] !== "") {
                return;
            }

            // Put X or O
            board[position] = currentPlayer;

            // Display X or O
            document.getElementsByClassName("cell")[position].innerHTML = currentPlayer;

            // Check winner
            checkWinner();

            // Change player
            if (currentPlayer === "X") {
                currentPlayer = "O";
            } else {
                currentPlayer = "X";
            }

            document.getElementById("turn").innerHTML =
                "Player " + currentPlayer + "'s Turn";
        }


        function checkWinner() {

            let winningPatterns = [

                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],

                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],

                [0, 4, 8],
                [2, 4, 6]

            ];

            for (let pattern of winningPatterns) {

                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                ) {
                    alert("Player " + board[a] + " Wins!");
                    resetGame();
                    return;
                }
            }
        }


        function resetGame() {

            board = ["", "", "", "", "", "", "", "",];

            let cells = document.getElementsByClassName("cell");

            for (let cell of cells) {
                cell.innerHTML = "";
            }

            currentPlayer = "X";

            document.getElementById("turn").innerHTML =
                "Player X's Turn";
        }

    </script>

</body>
</html>
</body>
</html>
